<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#0a0a12"/>
  <!-- cabinet body -->
  <rect x="7" y="4" width="18" height="24" rx="1.5" fill="#1a1a2e" stroke="#00ffff" stroke-width="1.5"/>
  <!-- screen -->
  <rect x="10" y="7" width="12" height="9" rx="0.5" fill="#061018" stroke="#00e5e5" stroke-width="0.75"/>
  <!-- screen glow pixel -->
  <rect x="12" y="9" width="3" height="2" fill="#00ffff" opacity="0.9"/>
  <rect x="16" y="11" width="4" height="2" fill="#ff00aa" opacity="0.85"/>
  <rect x="13" y="13" width="2" height="1.5" fill="#ffff00" opacity="0.8"/>
  <!-- control panel -->
  <rect x="10" y="18" width="12" height="3.5" rx="0.5" fill="#12122a"/>
  <!-- joystick -->
  <circle cx="13" cy="19.7" r="1.2" fill="#ff3366"/>
  <rect x="12.5" y="17.5" width="1" height="2.2" fill="#ccc"/>
  <!-- buttons -->
  <circle cx="18" cy="19.3" r="0.9" fill="#00ffff"/>
  <circle cx="20.5" cy="20.2" r="0.75" fill="#ffff00"/>
  <!-- base -->
  <rect x="8.5" y="25" width="15" height="2" rx="0.5" fill="#222240" stroke="#00ffff" stroke-width="0.6" opacity="0.9"/>
</svg>
